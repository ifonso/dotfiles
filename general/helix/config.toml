theme = "my_groove"

[editor]
color-modes = true
line-number = "relative"
shell = ["zsh", "-c"]
bufferline = "multiple"

[editor.soft-wrap]
enable = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.statusline]
left = ["mode", "spinner", "version-control", "file-base-name"]
right = ["diagnostics", "file-type", "separator", "position-percentage", "total-line-numbers"]
separator = " "
mode.normal = "NOR"
mode.insert = "INS"
mode.select = "SEL"

[editor.indent-guides]
render = true
character = "╎"
skip-levels = 1

# Keys --------------------------

[keys.insert.j]
k = "normal_mode" # Maps `jk` to exit insert mode

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]
C-r = ":config-reload"
"C-h" = ":buffer-previous"
"C-l" = ":buffer-next"

# Functions move
"tab" = "goto_next_function"
"S-tab" = "goto_prev_function"

# Mark line and move with them up/down
C-j = ["extend_to_line_bounds", "delete_selection", "paste_after"]
C-k = ["extend_to_line_bounds", "delete_selection", "move_line_up", "paste_before"]

[keys.normal.space]
"." = "file_picker_in_current_buffer_directory"

